    components: [pd_pioneer_ir]

esp8266:
  board: esp8285

logger:
  level: DEBUG
  logs:
    pd_pioneer_ir.climate: DEBUG
    remote.pd_pioneer: DEBUG

api:
  encryption:
    key: "+Hivhjhm2njYLrB0TWLwpnJOy0ugoWPtd5F/QLxKeGE="

ota:
  - platform: esphome
    password: "df18173edf61f007146c40a0e21ef3cc"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Espir Fallback Hotspot"
    password: "4ysz2isFGoxC"

captive_portal:

remote_receiver:
  id: rcvr
  pin:
    number: GPIO14
    inverted: true
  dump: all

remote_transmitter:
  id: tx_ir
  pin: GPIO4
  carrier_duty_percent: 50%

climate:
  - platform: pd_pioneer_ir
    id: pioneer_ac
    name: "Pioneer AC"
    transmitter_id: tx_ir
    receiver_id: rcvr
    use_fahrenheit: true
    visual:
      min_temperature: 61 °F
      max_temperature: 88 °F
      temperature_step: 0.5 °F

# Manual Pronto buttons (visible in Home Assistant for testing)
packages:
  manual_buttons: !include manual_buttons.yaml
